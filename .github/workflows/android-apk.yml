name: BlackOps1 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang git python3

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gerar o C++ recompilado (pipeline do XenonRecomp)
        run: |
          chmod +x build.sh tools/*.sh
          ./build.sh game/default.xex

      - name: Gerar as funções de kernel de teste
        run: python3 tools/gen_kernel_stubs.py generated

      - name: Diagnosticar estrutura do simde
        run: |
          echo "=== Procurando avx.h do simde ==="
          find "$GITHUB_WORKSPACE/XenonRecomp/thirdparty" -name "avx.h" -path "*simde*" 2>/dev/null || echo "avx.h não encontrado em thirdparty"
          echo "=== Conteúdo de thirdparty/simde (se existir) ==="
          ls -la "$GITHUB_WORKSPACE/XenonRecomp/thirdparty/simde" 2>/dev/null || echo "Pasta thirdparty/simde não existe"

      - name: Compilar o APK (inclui o código recompilado)
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -Pbo1.xenonrecomp="$GITHUB_WORKSPACE/XenonRecomp" \
            -Pbo1.generated="$GITHUB_WORKSPACE/generated"

      - name: Informações do APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: bo1-launcher-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar o diagnóstico do pipeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bo1-switch-tables-apk
          path: generated/BO1_switch_tables.toml
          if-no-files-found: warn
