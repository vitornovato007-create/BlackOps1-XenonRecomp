name: BlackOps1 XenonRecomp Android Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse-bo1:
    name: Build tools and analyse BO1
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang \
            git \
            shellcheck \
            python3

      - name: Show compiler versions
        run: |
          cmake --version
          ninja --version
          clang --version
          clang++ --version
          git --version

      - name: Validate shell scripts
        run: |
          bash -n build.sh
          bash -n tools/analyse_bo1.sh
          shellcheck build.sh tools/analyse_bo1.sh

      - name: Verify BO1 input
        run: |
          if [ ! -s game/default.xex ]; then
            echo "::error::game/default.xex está ausente ou vazio."
            exit 1
          fi

          echo "Entrada encontrada."
          ls -lh game/default.xex

      - name: Build XenonRecomp and analyse BO1
        run: |
          chmod +x build.sh tools/analyse_bo1.sh
          ./build.sh game/default.xex

      - name: Verify generated analysis
        run: |
          test -s generated/BO1_switch_tables.toml
          echo "Tabela gerada:"
          ls -lh generated/BO1_switch_tables.toml
          echo
          cat generated/BO1_switch_tables.toml

      - name: Upload BO1 analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: bo1-switch-tables
          path: generated/BO1_switch_tables.toml
          if-no-files-found: error
          retention-days: 14
