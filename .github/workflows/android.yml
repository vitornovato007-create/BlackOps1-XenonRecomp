name: BlackOps1 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar o APK de depuração
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Informações do APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: bo1-launcher-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
