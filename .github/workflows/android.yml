name: BlackOps1 XenonRecomp Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install basic validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3

      - name: Validate shell script
        run: |
          bash -n build.sh
          shellcheck build.sh

      - name: Diagnose initial project files
        shell: bash
        run: |
          set -uo pipefail

          missing=0

          for file in \
            README.md \
            docs/PORTING_AUDIT.md \
            config/BO1.toml.template \
            build.sh \
            .github/workflows/android.yml
          do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
              missing=1
            fi
          done

          echo
          echo "Current branch: $GITHUB_REF_NAME"
          echo "Repository: $GITHUB_REPOSITORY"

          if [ "$missing" -ne 0 ]; then
            echo "ERROR: One or more required files are missing or misnamed."
            exit 1
          fi

          echo "All bootstrap files are present."
          echo "This workflow validates the bootstrap only; it does not build an APK."
