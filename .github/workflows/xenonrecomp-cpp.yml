name: BlackOps1 XenonRecomp C++ Gerado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang git python3

      - name: Aceitar licenças do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gerar o C++ recompilado (pipeline do XenonRecomp)
        run: |
          chmod +x build.sh tools/*.sh
          ./build.sh game/default.xex

      - name: Gerar as funções de kernel de teste
        run: python3 tools/gen_kernel_stubs.py generated

      - name: Diagnosticar estrutura do simde
        run: |
          echo "=== Procurando avx.h do simde ==="
          find "$GITHUB_WORKSPACE/XenonRecomp/thirdparty" -name "avx.h" -path "*simde*" 2>/dev/null || echo "avx.h não encontrado em thirdparty"
          echo "=== Conteúdo de thirdparty/simde (se existir) ==="
          ls -la "$GITHUB_WORKSPACE/XenonRecomp/thirdparty/simde" 2>/dev/null || echo "Pasta thirdparty/simde não existe"

      - name: Listar o que será publicado
        run: |
          echo "=== Conteúdo de generated/ ==="
          find "$GITHUB_WORKSPACE/generated" -maxdepth 2 -type f -printf "%p (%s bytes)\n" | sort
          echo
          echo "=== Conteúdo de generated/ppc/ ==="
          find "$GITHUB_WORKSPACE/generated/ppc" -maxdepth 1 -type f -printf "%f (%s bytes)\n" | sort
          echo
          echo "=== Contagem ==="
          echo "Arquivos em generated/ppc: $(find "$GITHUB_WORKSPACE/generated/ppc" -maxdepth 1 -type f | wc -l)"
          echo "Tamanho total: $(du -sh "$GITHUB_WORKSPACE/generated" | cut -f1)"

      - name: Publicar o C++ gerado completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bo1-ppc-generated
          path: |
            generated/ppc/
            generated/kernel_stubs.cpp
            generated/BO1_switch_tables.toml
            generated/xenonrecomp.log
            generated/xenonanalyse.log
          if-no-files-found: error
