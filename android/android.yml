name: BlackOps1 XenonRecomp Bootstrap

on:
  workflow_dispatch:
    paths:
      - 'build.sh'
      - 'config/**'
      - 'docs/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  validate-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install basic validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3

      - name: Validate shell script
        run: |
          bash -n build.sh
          shellcheck build.sh

      - name: Validate initial project files
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/PORTING_AUDIT.md
          test -f config/BO1.toml.template
          test -f build.sh
          test -f .github/workflows/android.yml
          echo "Bootstrap files are present and shell syntax is valid."
          echo "This workflow does NOT build an APK. BO1-specific XenonRecomp config/runtime are not implemented yet."
